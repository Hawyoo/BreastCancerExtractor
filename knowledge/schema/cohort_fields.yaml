version: 0.2.0
title: 乳腺癌科研队列字段字典
questionnaire_source:
  title: 信息收集表-2026.4.9最终版
  url: https://f.kdocs.cn/g/kD2Xj3eU/
  verified_at: '2026-08-18'
  note: 题型、可见选项及条件展开关系已在登录后的WPS表单中核对；WPS中的文件上传题映射为本系统的来源文档和证据，不作为普通字符串答案。
null_policy:
  missing: null
  unknown: UNKNOWN
  not_applicable: NOT_APPLICABLE
common_types:
  yes_no_unknown: [YES, NO, UNKNOWN]
  laterality: [LEFT, RIGHT, BILATERAL, UNKNOWN]
  confidence: [LOW, MEDIUM, HIGH, VERIFIED]
notes:
  - 字段顺序即默认宽表导出顺序。
  - 带“补充填空”的字段保留原文，不覆盖对应的标准化字段。
  - 每个非空 AI 字段均须关联 document_id、region_id、source_text 和模型版本。
  - record_number 与 contact 是直接身份标识，不得从已脱敏图片自动抽取。

fields:
  # 基本信息、生活史与既往史
  - {key: record_number, label: 病案号（7位）, group: demographics, type: string, pattern: '^\d{7}$', capture: manual_restricted, sensitivity: direct_identifier}
  - key: sex
    label: 性别
    group: demographics
    type: enum
    values: [FEMALE, MALE]
    form_type: single_choice
    form_options: [FEMALE, MALE]
    document_coding:
      MEDICAL_RECORD_COVER:
        code_position: 性别字段名后的首个独立选择数字
        code_map: {'1': MALE, '2': FEMALE}
        printed_options: '1.男 2.女'
  - {key: contact, label: 联系方式, group: demographics, type: string, capture: manual_restricted, sensitivity: direct_identifier}
  - {key: birth_date, label: 出生日期, group: demographics, type: date, sensitivity: quasi_identifier}
  - {key: height_cm, label: 身高（cm）, group: demographics, type: number, unit: cm}
  - {key: weight_kg, label: 体重（kg）, group: demographics, type: number, unit: kg}
  - {key: menarche_age, label: 初潮年龄, group: reproductive_history, type: integer, unit: years}
  - {key: menopausal_status, label: 是否绝经, group: reproductive_history, type: yes_no_unknown, form_type: single_choice, form_options: [YES, NO, UNKNOWN], derivation: last_menstrual_period_near_admission}
  - {key: menopause_age, label: 绝经年龄, group: reproductive_history, type: integer, unit: years, depends_on: {field: menopausal_status, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: occupation, label: 职业, group: demographics, type: string, sensitivity: quasi_identifier}
  - {key: has_chronic_disease, label: 是否有慢性病史, group: medical_history, type: yes_no_unknown}
  - {key: chronic_disease, label: 慢性病史, group: medical_history, type: multiselect, values: [HYPERTENSION, DIABETES, CORONARY_HEART_DISEASE, OTHER], form_type: multiple_choice, depends_on: {field: has_chronic_disease, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: chronic_disease_other, label: '慢性病史:其他-补充填空', group: medical_history, type: string, depends_on: {field: chronic_disease, contains: OTHER, otherwise: NOT_APPLICABLE}}
  - {key: has_family_history, label: 是否有家族史, group: family_history, type: yes_no_unknown}
  - {key: family_history_detail, label: '是否有家族史:补充填空', group: family_history, type: string, depends_on: {field: has_family_history, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: has_given_birth, label: 是否生育, group: reproductive_history, type: yes_no_unknown}
  - {key: parity_count, label: 生育胎数, group: reproductive_history, type: integer, depends_on: {field: has_given_birth, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: childbirth_age, label: 生育年龄, group: reproductive_history, type: integer, unit: years, depends_on: {field: has_given_birth, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: smoking_history, label: 是否有吸烟史, group: lifestyle, type: yes_no_unknown}
  - {key: drinking_history, label: 是否有饮酒史, group: lifestyle, type: yes_no_unknown}
  - {key: first_breast_cancer, label: 是否首次患乳腺癌, group: medical_history, type: yes_no_unknown}
  - {key: prior_breast_surgery, label: 既往是否有乳腺手术史, group: medical_history, type: yes_no_unknown}
  - {key: prior_breast_surgery_date, label: 既往手术时间, group: medical_history, type: date_or_partial_date, depends_on: {field: prior_breast_surgery, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: prior_breast_surgery_type, label: 既往手术术式, group: medical_history, type: string, depends_on: {field: prior_breast_surgery, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: concurrent_other_cancer, label: 入院时是否合并其他癌种, group: medical_history, type: yes_no_unknown}
  - {key: concurrent_other_cancer_detail, label: '入院时是否合并其他癌种:补充填空', group: medical_history, type: string, depends_on: {field: concurrent_other_cancer, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: breast_laterality, label: 乳腺癌偏侧性, group: diagnosis, type: laterality}
  - {key: metastatic_at_presentation, label: 乳腺癌来院时是否转移, group: diagnosis, type: yes_no_unknown, default_if_unmentioned: 'NO', default_source_mode: INFERRED}
  - {key: metastatic_site, label: 转移部位, group: diagnosis, type: multiselect, depends_on: {field: metastatic_at_presentation, equals: 'YES', otherwise: NOT_APPLICABLE}}

  # 治疗前影像
  - {key: pre_us_available, label: 治疗前是否有超声结果, group: pretreatment_ultrasound, type: yes_no_unknown}
  - {key: pre_us_tumor_size_mm, label: 超声肿块大小（mm）, group: pretreatment_ultrasound, type: measurement_3d, unit: mm, dimensions: [length, width, height], optional_dimensions: [height], depends_on: {field: pre_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_us_tumor_location, label: 超声肿块位置, group: pretreatment_ultrasound, type: string, depends_on: {field: pre_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_us_nipple_distance_cm, label: 超声肿块距乳头距离（cm）, group: pretreatment_ultrasound, type: number, unit: cm, depends_on: {field: pre_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_us_skin_distance, label: 超声肿块距皮肤距离, group: pretreatment_ultrasound, type: measurement, needs_definition: true, depends_on: {field: pre_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_us_nodes_normal, label: 超声淋巴结是否正常, group: pretreatment_ultrasound, type: yes_no_unknown, depends_on: {field: pre_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_us_nodes_detail, label: '超声淋巴结是否正常:补充填空', group: pretreatment_ultrasound, type: string, depends_on: {field: pre_us_nodes_normal, equals: 'NO', otherwise: NOT_APPLICABLE}}
  - {key: pre_mmg_available, label: 治疗前是否有钼靶结果, group: pretreatment_mammography, type: yes_no_unknown}
  - {key: pre_mmg_single_lesion, label: 肿块是否单发, group: pretreatment_mammography, type: enum, values: [SINGLE, MULTIPLE], form_type: single_choice, form_options: [SINGLE, MULTIPLE], depends_on: {field: pre_mmg_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_mmg_birads, label: 钼靶BI-RADS分级, group: pretreatment_mammography, type: enum, values: ['0', '1', '2', '3', '4', '4A', '4B', '4C', '5', '6', OTHER], form_type: single_choice, normalization: birads_category_only, depends_on: {field: pre_mmg_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_mmg_birads_detail, label: '钼靶BI-RADS分级:补充填空', group: pretreatment_mammography, type: string, depends_on: {field: pre_mmg_birads, equals: OTHER, otherwise: NOT_APPLICABLE}}
  - {key: pre_mmg_calcification, label: 是否有钙化, group: pretreatment_mammography, type: yes_no_unknown, depends_on: {field: pre_mmg_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_mmg_nodes, label: 钼靶淋巴结情况, group: pretreatment_mammography, type: string, depends_on: {field: pre_mmg_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_mmg_other_single, label: 其他单发钼靶结果, group: pretreatment_mammography, type: evidence_document, depends_on: {field: pre_mmg_single_lesion, equals: SINGLE, otherwise: NOT_APPLICABLE}}
  - {key: pre_mmg_multifocal, label: 多发钼靶结果, group: pretreatment_mammography, type: evidence_document, depends_on: {field: pre_mmg_single_lesion, equals: MULTIPLE, otherwise: NOT_APPLICABLE}}
  - {key: pre_mri_available, label: 治疗前是否有磁共振结果, group: pretreatment_mri, type: yes_no_unknown}
  - {key: pre_mri_tumor_size_mm, label: 磁共振肿块大小（mm）, group: pretreatment_mri, type: measurement_3d, unit: mm, dimensions: [length, width, height], optional_dimensions: [height], depends_on: {field: pre_mri_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_mri_nodes_normal, label: 磁共振淋巴结是否正常, group: pretreatment_mri, type: yes_no_unknown, depends_on: {field: pre_mri_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: pre_mri_nodes_detail, label: '磁共振淋巴结是否正常:补充填空', group: pretreatment_mri, type: string, depends_on: {field: pre_mri_nodes_normal, equals: 'NO', otherwise: NOT_APPLICABLE}}
  - {key: other_pretreatment_imaging, label: 其他治疗前影像结果, group: pretreatment_imaging, type: string}

  # 原发灶穿刺
  - {key: primary_biopsy_performed, label: 是否行原发灶穿刺活检, group: primary_biopsy, type: yes_no_unknown}
  - {key: primary_pathology_type, label: 原发灶病理类型, group: primary_biopsy, type: coded_string, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: primary_pathology_grade, label: 原发灶病理分级, group: primary_biopsy, type: enum, values: ['1', '2', '3', UNKNOWN], normalization: arabic_integer_single_value, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: primary_er, label: 原发灶免疫组化ER, group: primary_biopsy, type: biomarker_status, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: primary_er_detail, label: '原发灶免疫组化ER:补充填空', group: primary_biopsy, type: string, depends_on: {field: primary_er, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: primary_pr, label: 原发灶免疫组化PR, group: primary_biopsy, type: biomarker_status, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: primary_pr_detail, label: '原发灶免疫组化PR:补充填空', group: primary_biopsy, type: string, depends_on: {field: primary_pr, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: primary_her2, label: 原发灶免疫组化Her-2, group: primary_biopsy, type: her2_ihc, values: ['0', '1+', '2+', '3+', UNKNOWN], normalization: her2_negative_to_zero, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: primary_ki67, label: 原发灶免疫组化Ki-67, group: primary_biopsy, type: biomarker_status, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: primary_ki67_detail, label: '原发灶免疫组化Ki-67:补充填空', group: primary_biopsy, type: string, depends_on: {field: primary_ki67, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: primary_other_ihc, label: 其他原发灶免疫组化结果, group: primary_biopsy, type: string, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: primary_molecular_subtype, label: 原发灶分子分型, group: primary_biopsy, type: enum, values: [LUMINAL_A, LUMINAL_B, HER2_ENRICHED, TRIPLE_NEGATIVE, UNKNOWN], form_type: single_choice, derivation: allowed_with_rules, depends_on: {field: primary_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}

  # 淋巴结穿刺
  - {key: node_biopsy_performed, label: 是否行淋巴结穿刺活检, group: node_biopsy, type: yes_no_unknown}
  - {key: node_pathology_type, label: 淋巴结病理类型, group: node_biopsy, type: coded_string, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_pathology_grade, label: 淋巴结病理分级, group: node_biopsy, type: enum, values: ['1', '2', '3', UNKNOWN, NOT_APPLICABLE], normalization: arabic_integer_single_value, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_er, label: 淋巴结免疫组化ER, group: node_biopsy, type: biomarker_status, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_er_detail, label: '淋巴结免疫组化ER:补充填空', group: node_biopsy, type: string, depends_on: {field: node_er, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: node_pr, label: 淋巴结免疫组化PR, group: node_biopsy, type: biomarker_status, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_pr_detail, label: '淋巴结免疫组化PR:补充填空', group: node_biopsy, type: string, depends_on: {field: node_pr, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: node_her2, label: 淋巴结免疫组化Her-2, group: node_biopsy, type: her2_ihc, values: ['0', '1+', '2+', '3+', UNKNOWN], normalization: her2_negative_to_zero, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_ki67, label: 淋巴结免疫组化Ki-67, group: node_biopsy, type: biomarker_status, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_ki67_detail, label: '淋巴结免疫组化Ki-67:补充填空', group: node_biopsy, type: string, depends_on: {field: node_ki67, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: node_other_ihc_1, label: 其他淋巴结免疫组化结果_1, group: node_biopsy, type: string, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_other_ihc_2, label: 其他淋巴结免疫组化结果_2, group: node_biopsy, type: string, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: node_molecular_subtype, label: 淋巴结分子分型, group: node_biopsy, type: enum, values: [LUMINAL_A, LUMINAL_B, HER2_ENRICHED, TRIPLE_NEGATIVE, UNKNOWN], form_type: single_choice, derivation: allowed_with_rules, depends_on: {field: node_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}

  # 转移灶穿刺
  - {key: metastasis_biopsy_performed, label: 是否行转移灶穿刺活检, group: metastasis_biopsy, type: yes_no_unknown}
  - {key: metastasis_pathology_type, label: 转移灶病理类型, group: metastasis_biopsy, type: coded_string, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: metastasis_pathology_grade, label: 转移灶病理分级, group: metastasis_biopsy, type: enum, values: ['1', '2', '3', UNKNOWN, NOT_APPLICABLE], normalization: arabic_integer_single_value, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: metastasis_er, label: 转移灶免疫组化ER, group: metastasis_biopsy, type: biomarker_status, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: metastasis_er_detail, label: '转移灶免疫组化ER:补充填空', group: metastasis_biopsy, type: string, depends_on: {field: metastasis_er, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: metastasis_pr, label: 转移灶免疫组化PR, group: metastasis_biopsy, type: biomarker_status, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: metastasis_pr_detail, label: '转移灶免疫组化PR:补充填空', group: metastasis_biopsy, type: string, depends_on: {field: metastasis_pr, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: metastasis_her2, label: 转移灶免疫组化Her-2, group: metastasis_biopsy, type: her2_ihc, values: ['0', '1+', '2+', '3+', UNKNOWN], normalization: her2_negative_to_zero, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: metastasis_ki67, label: 转移灶免疫组化Ki-67, group: metastasis_biopsy, type: biomarker_status, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: metastasis_ki67_detail, label: '转移灶免疫组化Ki-67:补充填空', group: metastasis_biopsy, type: string, depends_on: {field: metastasis_ki67, equals: POSITIVE, otherwise: NOT_APPLICABLE}}
  - {key: metastasis_other_ihc, label: 其他转移灶免疫组化结果, group: metastasis_biopsy, type: string, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: metastasis_molecular_subtype, label: 转移灶分子分型, group: metastasis_biopsy, type: enum, values: [LUMINAL_A, LUMINAL_B, HER2_ENRICHED, TRIPLE_NEGATIVE, UNKNOWN], form_type: single_choice, derivation: allowed_with_rules, depends_on: {field: metastasis_biopsy_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}

  # 新辅助治疗与治疗后影像
  - {key: neoadjuvant_received, label: 术前是否接受新辅助治疗, group: neoadjuvant, type: yes_no_unknown}
  - {key: neoadjuvant_regimen, label: 新辅助治疗方案, group: neoadjuvant, type: regimen, depends_on: {field: neoadjuvant_received, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: neoadjuvant_cycles, label: 新辅助治疗周期, group: neoadjuvant, type: integer, depends_on: {field: neoadjuvant_received, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_us_available, label: 新辅助治疗后是否有超声结果, group: post_neoadjuvant_imaging, type: yes_no_unknown, depends_on: {field: neoadjuvant_received, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_us_size_mm, label: 新辅助治疗后超声肿块大小（mm）, group: post_neoadjuvant_imaging, type: measurement_3d, unit: mm, dimensions: [length, width, height], optional_dimensions: [height], depends_on: {field: post_neoadj_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_us_tumor_response, label: 新辅助治疗后超声肿块是否缓解, group: post_neoadjuvant_imaging, type: response_status, needs_definition: true, depends_on: {field: post_neoadj_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_us_nodes, label: 新辅助治疗后超声淋巴结情况, group: post_neoadjuvant_imaging, type: string, depends_on: {field: post_neoadj_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_us_nodes_response, label: 新辅助治疗后超声淋巴结是否缓解, group: post_neoadjuvant_imaging, type: response_status, needs_definition: true, depends_on: {field: post_neoadj_us_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_mri_available, label: 新辅助治疗后是否有磁共振结果, group: post_neoadjuvant_imaging, type: yes_no_unknown, depends_on: {field: neoadjuvant_received, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_mri_size_mm, label: 新辅助治疗后磁共振肿块大小（mm）, group: post_neoadjuvant_imaging, type: measurement_3d, unit: mm, dimensions: [length, width, height], optional_dimensions: [height], depends_on: {field: post_neoadj_mri_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_mri_tumor_response, label: 新辅助治疗后磁共振肿块是否缓解, group: post_neoadjuvant_imaging, type: response_status, needs_definition: true, depends_on: {field: post_neoadj_mri_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_mri_nodes, label: 新辅助治疗后磁共振淋巴结情况, group: post_neoadjuvant_imaging, type: string, depends_on: {field: post_neoadj_mri_available, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_mri_nodes_response, label: 新辅助治疗后磁共振淋巴结是否缓解, group: post_neoadjuvant_imaging, type: response_status, needs_definition: true, depends_on: {field: post_neoadj_mri_available, equals: 'YES', otherwise: NOT_APPLICABLE}}

  # 手术及术后病理
  - {key: surgery_performed, label: 是否行手术治疗, group: surgery, type: yes_no_unknown}
  - {key: surgery_date, label: 手术日期, group: surgery, type: date, depends_on: {field: surgery_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: surgery_type, label: 手术方式, group: surgery, type: enum, values: [MASTECTOMY, BREAST_CONSERVING], form_type: single_choice, depends_on: {field: surgery_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: reconstruction_performed, label: 是否重建, group: surgery, type: yes_no_unknown, depends_on: {field: surgery_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: reconstruction_type, label: 重建方式, group: surgery, type: enum, values: [IMPLANT, AUTOLOGOUS_FLAP, COMBINED], form_type: single_choice, depends_on: {field: reconstruction_performed, equals: 'YES', otherwise: NOT_APPLICABLE}}
