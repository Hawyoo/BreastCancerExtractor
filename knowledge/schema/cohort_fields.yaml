  # 诊断、分期与新辅助疗效
  - {key: breast_cancer_type, label: 乳腺癌类型, group: diagnosis, type: coded_string}
  - {key: breast_cancer_diagnosis_date, label: 乳腺癌确诊日期, group: diagnosis, type: date_or_partial_date}
  - key: clinical_stage
    label: 临床分期
    group: staging
    type: stage_assessment
    derivation: recorded_then_inferred
    allowed_prefixes: [c, yc]
    required_components: [T, N, M]
    normalization: compact_tnm
    source_strategy: 明确记录的治疗前cTNM优先；缺失时综合治疗前查体、影像、原发灶/区域淋巴结穿刺和远处转移证据推断。新辅助后术前再评估使用ycTNM且不覆盖原cTNM。
    description: 填写cTNM；新辅助后临床再评估可填写ycTNM。必须包含T、N、M，不以单独的I/II/III/IV分期组替代。
  - key: pathological_stage
    label: 病理分期
    group: staging
    type: stage_assessment
    derivation: recorded_then_inferred
    allowed_prefixes: [p, yp]
    required_components: [T, N, M]
    normalization: compact_tnm
    source_strategy: 未行新辅助时填写pTNM；新辅助后手术病理填写ypTNM。T、N及术后病理类型优先依据术后病理报告，手术记录不得覆盖。
    description: 填写pTNM；接受新辅助治疗后填写ypTNM。必须包含T、N、M，不以单独的I/II/III/IV分期组替代，也不得因未记录远处转移而臆造pM0。
  - {key: post_neoadj_pcr, label: '术后新辅助评估:是否pCR', group: treatment_response, type: yes_no_unknown, needs_definition: true, depends_on: {field: neoadjuvant_received, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_mp_grade, label: '术后新辅助评估:MP分级', group: treatment_response, type: enum, values: [MP1, MP2, MP3, MP4, MP5, UNKNOWN], depends_on: {field: neoadjuvant_received, equals: 'YES', otherwise: NOT_APPLICABLE}}
  - {key: post_neoadj_rcb_grade, label: '术后新辅助评估:RCB分级', group: treatment_response, type: enum, values: [RCB-0, RCB-I, RCB-II, RCB-III, UNKNOWN], depends_on: {field: neoadjuvant_received, equals: 'YES', otherwise: NOT_APPLICABLE}}

