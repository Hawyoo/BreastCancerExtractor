version: 0.2.0
title: 文档类型与 ROI 原子映射
description: >-
  ROI 采用原子化定义：一个 ROI 只对应一个最终字段或一个元数据项目。即使多个项目出现在同一段连续文字中，也应分别选择 ROI 类型并分别框选；允许 ROI 重叠。
global_rules:
  - 每个 ROI 只允许包含一个 target_fields 或 metadata_fields 项目，禁止一个 ROI 同时映射多个项目。
  - ROI 应覆盖该单项的字段名、字段值及必要上下文，不应只框选孤立数字。
  - 多个项目位于同一段文字时，应逐项建立 ROI；不同 ROI 可以重叠，不因文字连续而合并语义项目。
  - 一张图片允许包含多个 ROI；每个 ROI 的高信度语义归属只作用于自己的单项。
  - ROI 只是识别重点和证据定位；未框选区域仍参与整页 OCR。
  - 脱敏遮盖区域与信息 ROI 必须分开保存，脱敏区域不得进入 OCR、证据图或模型输入。
imaging_rules:
  - 影像 ROI 只标注明确恶性/乳腺癌目标病灶相关项目；明确良性病灶不得混入恶性肿块 ROI。
  - 检查日期和治疗阶段必须拆为两个独立 ROI 项目。
  - 治疗前与新辅助治疗后影像项目必须分别框选和保存，不得在同一 ROI 中合并。
  - 同一检查有多个明确恶性病灶时可分别为各病灶重复绘制相同类型 ROI；不得因多个良性结节创建恶性病灶 ROI。
  - 肿块大小、位置、距乳头距离、距皮肤距离、淋巴结和缓解情况分别使用独立 ROI。
